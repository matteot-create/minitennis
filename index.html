<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Chat</title>

  <style>
    body { font-family: Arial; margin: 0; padding: 0; background: #f5f5f5; }
    #chatTitle { background: #333; color: #fff; padding: 10px; text-align: center; }
    #membersList { background: #eee; padding: 10px; width: 25%; float: left; height: 90vh; overflow-y: auto; }
    #chatArea { width: 75%; float: left; padding: 10px; height: 90vh; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; background: #fff; padding: 10px; border: 1px solid #ccc; }
    #inputArea { display: flex; margin-top: 10px; }
    #msgInput { flex: 1; padding: 8px; }
    #sendBtn { padding: 8px 12px; }
    #inviteBanner { display: none; background: #fffae6; padding: 10px; border: 1px solid #ccc; margin-bottom: 10px; }
    #leavePrivateBtn { display: none; margin-left: 10px; }
    .availableBtn { cursor: pointer; color: blue; margin-left: 10px; }
  </style>
</head>

<body>
  <div id="chatTitle">General Chat</div>

  <div id="membersList"></div>

  <div id="chatArea">
    <div id="inviteBanner">
      <span id="inviteText"></span>
      <button id="joinPrivateBtn">Join</button>
    </div>

    <div id="messages"></div>

    <div id="inputArea">
      <input id="msgInput" type="text" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
      <button id="leavePrivateBtn">Leave private chat</button>
    </div>
  </div>

  <script type="module">
    // ===============================
    // FIREBASE INIT
    // ===============================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore, doc, setDoc, deleteDoc,
      collection, addDoc, onSnapshot, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_KEY",
      authDomain: "YOUR_DOMAIN",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_BUCKET",
      messagingSenderId: "YOUR_SENDER",
      appId: "YOUR_APP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ===============================
    // GLOBAL STATE
    // ===============================
    let currentUser = prompt("Enter your name:");
    let currentRoom = "general";

    // ===============================
    // DOM ELEMENTS
    // ===============================
    const messagesDiv = document.getElementById("messages");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const membersList = document.getElementById("membersList");
    const chatTitle = document.getElementById("chatTitle");
    const leavePrivateBtn = document.getElementById("leavePrivateBtn");
    const inviteBanner = document.getElementById("inviteBanner");
    const inviteText = document.getElementById("inviteText");
    const joinPrivateBtn = document.getElementById("joinPrivateBtn");

    // ===============================
    // PRESENCE SYSTEM
    // ===============================
    async function setPresence() {
      await setDoc(doc(db, "presence", currentUser), {
        name: currentUser,
        timestamp: Date.now()
      });
    }
    setPresence();
    setInterval(setPresence, 20000);

    // ===============================
    // LOAD MEMBERS LIST
    // ===============================
    onSnapshot(collection(db, "presence"), (snapshot) => {
      membersList.innerHTML = "";

      snapshot.forEach((docSnap) => {
        const user = docSnap.id;

        let privateLabel = "";
        if (currentRoom !== "general" && currentRoom.includes(user)) {
          privateLabel = `<span style="color:#777; font-size:12px;">(in private chat)</span>`;
        }

        const div = document.createElement("div");
        div.innerHTML = `
          <b>${user}</b> ${privateLabel}
          <span class="availableBtn" data-user="${user}">Available</span>
        `;
        membersList.appendChild(div);
      });

      document.querySelectorAll(".availableBtn").forEach(btn => {
        btn.onclick = () => {
          const targetUser = btn.dataset.user;
          if (!targetUser || targetUser === currentUser) return;
          createPrivateInvite(targetUser);
        };
      });
    });

    // ===============================
    // PRIVATE CHAT INVITE SYSTEM
    // ===============================
    function createPrivateInvite(targetUser) {
      if (!targetUser || targetUser === currentUser) return;

      const roomId = [currentUser, targetUser].sort().join("_");

      setDoc(doc(db, "privateInvites", targetUser), {
        from: currentUser,
        roomId: roomId,
        timestamp: Date.now()
      });

      joinPrivateChat(roomId);
    }

    onSnapshot(doc(db, "privateInvites", currentUser), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        inviteBanner.style.display = "block";
        inviteText.innerText = `${data.from} wants to chat privately with you`;

        joinPrivateBtn.onclick = () => {
          joinPrivateChat(data.roomId);
          deleteDoc(doc(db, "privateInvites", currentUser));
          inviteBanner.style.display = "none";
        };
      } else {
        inviteBanner.style.display = "none";
      }
    });

    // ===============================
    // SWITCH TO PRIVATE CHAT
    // ===============================
    function joinPrivateChat(roomId) {
      currentRoom = roomId;
      chatTitle.innerText = `Private Chat (${roomId})`;
      leavePrivateBtn.style.display = "inline-block";
      loadMessages();
    }

    // ===============================
    // LEAVE PRIVATE CHAT
    // ===============================
    leavePrivateBtn.onclick = () => {
      currentRoom = "general";
      chatTitle.innerText = "General Chat";
      leavePrivateBtn.style.display = "none";
      loadMessages();
    };

    // ===============================
    // LOAD MESSAGES
    // ===============================
    let unsubscribeMessages = null;

    function loadMessages() {
      if (unsubscribeMessages) unsubscribeMessages();

      messagesDiv.innerHTML = "";

      const col = currentRoom === "general"
        ? collection(db, "chat")
        : collection(db, "privateChats", currentRoom, "messages");

      const q = query(col, orderBy("timestamp"));

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        messagesDiv.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const div = document.createElement("div");
          div.innerHTML = `<b>${msg.user}:</b> ${msg.text}`;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    loadMessages();

    // ===============================
    // SEND MESSAGE
    // ===============================
    sendBtn.onclick = async () => {
      const text = msgInput.value.trim();
      if (!text) return;

      const col = currentRoom === "general"
        ? collection(db, "chat")
        : collection(db, "privateChats", currentRoom, "messages");

      await addDoc(col, {
        user: currentUser,
        text: text,
        timestamp: Date.now()
      });

      msgInput.value = "";
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realtime Lobby</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f2f2f2;
}

#container {
  display: flex;
  height: 100vh;
}

/* LEFT: CHAT */
#chatArea {
  flex: 3;
  display: flex;
  flex-direction: column;
  background: white;
  border-right: 2px solid #ddd;
}

#chatHeader {
  padding: 10px;
  background: #007bff;
  color: white;
  font-size: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#leavePrivateBtn {
  display: none;
  background: #ff4444;
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

#inputArea {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
}

#msgInput {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}

#sendBtn {
  padding: 10px 20px;
  background: #007bff;
  color: white;
  border: none;
  cursor: pointer;
}

/* RIGHT: MEMBERS */
#membersArea {
  flex: 1;
  background: #fafafa;
  padding: 10px;
}

.member {
  padding: 10px;
  background: white;
  margin-bottom: 8px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.availableBtn {
  background: #28a745;
  color: white;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}

/* INVITE BANNER */
#inviteBanner {
  display: none;
  background: #ffe680;
  padding: 10px;
  border-bottom: 2px solid #e6c200;
}

#inviteBanner button {
  margin-left: 10px;
  padding: 6px 12px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="inviteBanner">
  <span id="inviteText"></span>
  <button id="joinPrivateBtn">Join private chat</button>
</div>

<div id="container">

  <div id="chatArea">
    <div id="chatHeader">
      <span id="chatTitle">General Chat</span>
      <span id="leavePrivateBtn">Leave private chat</span>
    </div>

    <div id="messages"></div>

    <div id="inputArea">
      <input id="msgInput" placeholder="Type a message ...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div id="membersArea">
    <h3>Members</h3>
    <div id="membersList"></div>
  </div>

</div>

<!-- JAVASCRIPT COMPLETO -->
<script type="module">

/* ===============================
   FIREBASE INIT
=============================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, doc, setDoc, deleteDoc,
  collection, addDoc, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER",
  appId: "YOUR_APP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===============================
   GLOBAL STATE
=============================== */
let currentUser = prompt("Enter your name:");
let currentRoom = "general";

/* ===============================
   DOM ELEMENTS
=============================== */
const messagesDiv = document.getElementById("messages");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const membersList = document.getElementById("membersList");
const chatTitle = document.getElementById("chatTitle");
const leavePrivateBtn = document.getElementById("leavePrivateBtn");
const inviteBanner = document.getElementById("inviteBanner");
const inviteText = document.getElementById("inviteText");
const joinPrivateBtn = document.getElementById("joinPrivateBtn");

/* ===============================
   PRESENCE SYSTEM
=============================== */
async function setPresence() {
  await setDoc(doc(db, "presence", currentUser), {
    name: currentUser,
    timestamp: Date.now()
  });
}
setPresence();
setInterval(setPresence, 20000);

/* ===============================
   LOAD MEMBERS LIST
=============================== */
onSnapshot(collection(db, "presence"), (snapshot) => {
  membersList.innerHTML = "";

  snapshot.forEach((docSnap) => {
    const user = docSnap.id;

    const div = document.createElement("div");
    div.className = "member";
    div.innerHTML = `
      <span>${user}</span>
      <span class="availableBtn" data-user="${user}">Available</span>
    `;
    membersList.appendChild(div);
  });

  document.querySelectorAll(".availableBtn").forEach(btn => {
    btn.onclick = () => {
      const targetUser = btn.dataset.user;
      if (targetUser !== currentUser) {
        createPrivateInvite(targetUser);
      }
    };
  });
});

/* ===============================
   PRIVATE CHAT INVITE SYSTEM
=============================== */
function createPrivateInvite(targetUser) {
  const roomId = [currentUser, targetUser].sort().join("_");

  setDoc(doc(db, "privateInvites", targetUser), {
    from: currentUser,
    roomId: roomId,
    timestamp: Date.now()
  });

  joinPrivateChat(roomId);
}

onSnapshot(doc(db, "privateInvites", currentUser), (docSnap) => {
  if (docSnap.exists()) {
    const data = docSnap.data();
    inviteBanner.style.display = "block";
    inviteText.innerText = `${data.from} wants to chat privately with you`;

    joinPrivateBtn.onclick = () => {
      joinPrivateChat(data.roomId);
      deleteDoc(doc(db, "privateInvites", currentUser));
      inviteBanner.style.display = "none";
    };
  } else {
    inviteBanner.style.display = "none";
  }
});

/* ===============================
   SWITCH TO PRIVATE CHAT
=============================== */
function joinPrivateChat(roomId) {
  currentRoom = roomId;
  chatTitle.innerText = `Private Chat (${roomId})`;
  leavePrivateBtn.style.display = "inline-block";
  loadMessages();
}

/* ===============================
   LEAVE PRIVATE CHAT
=============================== */
leavePrivateBtn.onclick = () => {
  currentRoom = "general";
  chatTitle.innerText = "General Chat";
  leavePrivateBtn.style.display = "none";
  loadMessages();
};

/* ===============================
   LOAD MESSAGES
=============================== */
let unsubscribeMessages = null;

function loadMessages() {
  if (unsubscribeMessages) unsubscribeMessages();

  messagesDiv.innerHTML = "";

  const col = currentRoom === "general"
    ? collection(db, "chat")
    : collection(db, "privateChats", currentRoom, "messages");

  const q = query(col, orderBy("timestamp"));

  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    messagesDiv.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const msg = docSnap.data();
      const div = document.createElement("div");
      div.innerHTML = `<b>${msg.user}:</b> ${msg.text}`;
      messagesDiv.appendChild(div);
    });

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

loadMessages();

/* ===============================
   SEND MESSAGE
=============================== */
sendBtn.onclick = async () => {
  const text = msgInput.value.trim();
  if (!text) return;

  const col = currentRoom === "general"
    ? collection(db, "chat")
    : collection(db, "privateChats", currentRoom, "messages");

  await addDoc(col, {
    user: currentUser,
    text: text,
    timestamp: Date.now()
  });

  msgInput.value = "";
};

</script>
</body>
</html>
